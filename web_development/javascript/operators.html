<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a=10;
        var b=5;
        document.write("Arithematic operators <br>");
        document.write(a+b,"<br>");
        document.write(a-b,"<br>");
        document.write(a*b,"<br>");
        document.write(a/b,"<br>");
        document.write(a%b,"<br>");
        document.write(a++,"<br>");  // post-increament
        document.write(++a,"<br>");  // pre-increament

         document.write("<br> comparision operator: <br>");

         if(a==b){
            document.writeln("both equals <br>");
         }

          if(a===b){
            document.writeln("both equals <br>");
         }

          if(a!=b){
            document.writeln("not equal <br>");
         }

          if(a!==b){
            document.writeln("both equals <br>");
         }

          if(a>b){
            document.writeln(" a is greater <br>");
         }

          if(a>=b){
            document.writeln(" a is greater <br>");
         }

          if(a<b){
            document.writeln(" b is greater <br>");
         }

          if(a<=b){
            document.writeln(" b is greater <br>");
         }



    </script>
</body>
</html>
