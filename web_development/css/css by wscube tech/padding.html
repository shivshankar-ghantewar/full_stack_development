<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            height: 200px;
            width: 200px;
            background-color: aqua;
            /* padding also increase of element => element size+ padding size= total size */
            padding-left: 20px;
            padding-top: 20px;
        }

        #box2{
             height: 200px;
             width: 200px;
             background-color: blueviolet;
             padding: 40px;
        }
    </style>
</head>
<body>
     <div id="box">welcome</div>
     <div id="box2">hello world</div>
</body>
</html>
