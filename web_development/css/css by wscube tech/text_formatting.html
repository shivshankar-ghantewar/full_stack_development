<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>

    .box{
      height: 400px;
      width: 1250px;
      background-color: blueviolet;
      color: black;
      text-align: center;
      font-weight: bold;
      font-style: oblique;
      text-decoration:line-through; /* underline*/
      text-transform: uppercase;
      word-spacing: 25px;  /*space between words*/
      letter-spacing: 10px;   /*space between lettters*/
      font-family: Georgia, 'Times New Roman', Times, serif;
    }
    h1{
        /* one em=16px if not give to parent . if give to parent to 10px then 1em=10px */
        font-size: 3em;  
    }
    h2{
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
   </style>
</head>
<body>
   <div class="box">
             <h1> welcome to WScube Tech </h1>
             <h2>welcome to fortune</h2>
   </div>
</body>
</html>
