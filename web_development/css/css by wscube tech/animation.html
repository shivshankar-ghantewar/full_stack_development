<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 200px;
            width: 200px;
            background-image: url(nature.jpg);
            background-size: cover;
            position: relative;
            /* animation: myanime 5s infinite;  infinite to run continuosly */
            animation: myanime 5s;
        }

        @keyframes myanime{
            0%{
                background-image: url(nature.jpg);
                background-size: cover;
                top: 0px;
                left:0px
            }

            25%{
                background-image: url(best.jpg);
                background-size: cover;
                top: 0px;
                left:300px
            }

            50%{
                background-image: url(shri\ ganesh.jpg);
                background-size: cover;
                top: 200px;
                left:300px
            }

            75%{
                 background-image: url(portfolio.jpg);
                background-size: cover;
                top: 200px;
                left:0px
            }

            100%{
                background-image: url(nature.jpg);
                background-size: cover;
                top: 0px;
                left:0px
            }

          
        }
    </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
