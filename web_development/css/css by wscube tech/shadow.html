<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 500px;
            width: 500px;
            background-color: aqua;
            display: flex;
            justify-content: center;
            align-items: center;
            /* box-shadow: h-offset v-offset blur spread_color; */
            /* inset: for in box shadow */
            box-shadow: 0px 0px 10px 4px red inset;
        }

        h1{
            /* text-shadow: horizontal vertical blur color; */
            text-shadow: 5px 5px 5px rgb(125, 125, 219), 5px 5px 5px rgb(233, 13, 13) ;
        }
    </style>
</head>
<body>
       <div>
           <h1>welcome to fortune cloud</h1>
       </div>
</body>
</html>
