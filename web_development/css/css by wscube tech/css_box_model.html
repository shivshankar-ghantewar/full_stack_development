<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <style>
    .box1{
        border:4px solid blueviolet ;
        float: left;
        background-color: chartreuse;
    }
    .box2{
        border:4px dotted greenyellow ;
        float: left;
        background-color: brown;
    }
    .box3{
        /* border add more pixels to existing size 
        heigh=100px + border 4px = total height=104 px */
        /* border:4px double rgb(9, 118, 118) ;   */
        border-left: 4px solid brown;
        background-color: aqua;
        float:left;
    }

    .box1,.box2,.box3{
        height:200px;
        width: 200px;
        gap: 10px;
        display: flex;
        /* align-items: for vertical; */
        align-items: center;
        /* justify-content:for horizontal; */
        justify-content: center;
    }

    #main{
        display: flex;
        gap:50px;
    }
    
  </style>
</head>
<body>
      <div id="main">
       <div class="box1">first</div>
       <div class="box2">second</div>
       <div class="box3">Third</div>
      </div>
</body>
</html>
