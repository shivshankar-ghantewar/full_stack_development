<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 200px;
            width: 200px;
            border-radius: 5px solid green;
           
        }

        #main1{
            background-color: aqua;
            margin:0px auto;
        }

        #main2{
            background-color: blue;
            margin-top: 10px;
        }
        #main3{
            background-color: chartreuse;
            margin-bottom: 10px;
        }
        #main4{
            background-color: cadetblue;
            margin-left: 20px;
            margin-right: 10px;
        }

        #container{
            height: 250px;
            width: 850px;
            background-color: black;
            display: flex;
            justify-content: space-around;
        }
        #container2{
            height: 200px;
            width: 100%;
            background-color: aqua;
        }
        #main5{
            height: 100px;
            width: 200px;
            background-color: #a52a2a;
            /* to center element */
            margin: auto ;  
        }
    </style>
</head>
<body>
       <div id="container">
         <div class="box" id="main1">1</div>
         <div class="box" id="main2">2</div>
         <div class="box" id="main3">3</div>
         <div class="box" id="main4">4</div>
       </div>

       <div id="container2">
               <div id="main5"></div>
       </div>
</body>
</html>
