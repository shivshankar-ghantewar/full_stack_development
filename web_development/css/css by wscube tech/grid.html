<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            height: 600px;
            width: 800px;
            display: grid;
            grid-template-columns:repeat(4,1fr) ;
            grid-template-rows: repeat(3,1fr);
            gap: 10px;
            background-color: aqua;
            padding: 10px;

        }

        .element{
               background-color: blueviolet;
              
        }

        #element1{
            grid-row:1/4;
        }

        #element2{
            grid-column: 2/4;
        }
        #element8{
            grid-row: 2/4;
            grid-column: 4/5;
        }
    </style>
</head>
<body>
        <div class="container">
            <div class="element" id="element1">1</div>
            <div class="element" id="element2">2</div>
            <div class="element" id="element3">3</div>
            <div class="element" id="element4">4</div>
            <div class="element" id="element5">5</div>
            <div class="element" id="element6">6</div>
            <div class="element" id="element7">7</div>
            <div class="element" id="element8">8</div>
        </div>
</body>
</html>
