<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
           height: 400px;
           width: 400px;
           background-color: aqua;
           margin-left: 10px;
        }

        .box2{
           height: 400px;
           width: 400px;
           background-color: rgb(164, 20, 133);
           margin-left: 10px;
        }

        .container{
             display: flex;
            
        }

        @media(max-width:835px) and (min-width:635px) {
            .box1{
              height: 300px;
              width: 300px;
              background-color: rgb(39, 181, 98);  
            }

            .box2{
              height: 300px;
              width: 300px;
              background-color: rgb(185, 194, 12);
               margin-left: 10px;
            }
        }

          @media(max-width:635px) and (min-width:335px) {
            .box1{
              height: 150px;
              width: 150px;
              background-color: rgb(25, 63, 161);  
            }

            .box2{
               height: 150px;
               width: 150px;
               background-color: rgb(153, 21, 21);
               margin-left: 10px;
            }
        }
    </style>
</head>
<body>
       <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
       </div>
</body>
</html>
