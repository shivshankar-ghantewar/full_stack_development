<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        
        <style>

            #anime_first{
                width: 0%; 
                animation: myanime 4s ;
            }

            @keyframes myanime{
                0%{
                    width:0%;
                }

                 25%{
                    width:25%;
                }

                 50%{
                    width:50%;
                }

                 75%{
                    width:75%;
                }

                
                 100%{
                    width:100%;
                }


            }
        </style>
</head>
<body>
       <div class="progress" role="progressbar" aria-label="Example with label" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="height: 30px;">
           <div class="progress-bar bg-danger" >25%</div>
        </div> 
           <br>
         <div class="progress" role="progressbar" aria-label="Example with label" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">
           <div class="progress-bar progress-bar-danger " style="width: 50%">50%</div>
        </div> 
        <br>
         <div class="progress" role="progressbar" aria-label="Example with label" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" style="height: 50px;">
           <div class="progress-bar bg-warning" style="width: 75%">75%</div>
        </div> 
     <br>

        <div class="progress">
              <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:100%;"   id="anime_first"></div>
        </div>
</body>
</html>
